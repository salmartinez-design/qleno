# Qleno CI — runs on every PR + push to main.
#
# Five concerns:
#   1. .dispatch-stop guard — if the file exists at repo root on
#      the branch under test, fail immediately. Sal can drop this
#      file via the GitHub mobile app to halt all autonomous work.
#   2. any-array-guard — block the ANY(array) trap. It type-checks
#      and builds fine and throws at RUNTIME at every input length,
#      so tsc-check and build cannot catch it. Eighteen fixes and
#      counting; the worst instances were swallowed by a catch and
#      silently dropped hand-set pay overrides from payroll.
#   3. clock-timezone-guard — block a server-side clock time that
#      names no timeZone. Railway runs the container in UTC, so it
#      renders five hours ahead of Central. It type-checks, bundles,
#      and looks correct on a Mac in Chicago; it only breaks in
#      production. It once told a customer her cleaner was five
#      hours out while the cleaner was pulling up.
#   4. tsc-check — type-check the api-server + frontend without
#      emitting. Catches PRs that compile in isolation but break
#      the workspace's shared types.
#   5. build — full build of api-server + frontend, the same
#      command Railway runs. Catches PRs that pass tsc but fail
#      bundling (Vite import errors, etc.).
#
# These are the candidate "required status checks" for branch
# protection (see docs/branch-protection-setup.md). The Playwright
# suite lives in a separate workflow and is currently
# advisory-only.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-stop-guard:
    name: dispatch-stop-guard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - name: Halt if .dispatch-stop is present
        run: |
          if [ -f .dispatch-stop ]; then
            echo "::error::.dispatch-stop file is present at repo root."
            echo "STOP file present, halting all autonomous work."
            echo "Remove the file to re-enable CI."
            cat .dispatch-stop || true
            exit 1
          fi
          echo "no .dispatch-stop file — proceeding"

  # Runtime-only bug class: `= ANY(${jsArray})` compiles and bundles
  # cleanly, then throws on every query. Nothing else in this pipeline
  # can see it, so it gets its own gate. Deliberately not `needs:` the
  # stop-guard — it costs seconds and the answer is useful even when
  # the rest of CI is halted.
  any-array-guard:
    name: any-array-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Block the ANY(array) trap
        run: node scripts/guard-any-array.mjs

  # Timezone-only bug class: a formatter with `hour:` and no
  # `timeZone` renders in the process's zone, which on Railway is
  # UTC. tsc passes, the bundle passes, and a developer in Chicago
  # sees the right time — the wrong one only reaches the customer.
  # Same shape as the guard above: cheap, runtime-only, invisible to
  # every other gate, so it does not `needs:` the stop-guard either.
  clock-timezone-guard:
    name: clock-timezone-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Block a clock time with no timezone
        run: node scripts/guard-clock-timezone.mjs

  # [instant-date-tz 2026-08-21] The behavior half of the same rule. The guard
  # above is a text scan; this proves the actual formatting — that the real
  # 9:12 PM Central signature renders as Aug 19 with a zone and Aug 20 without.
  clock-timezone-test:
    name: clock-timezone-test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Customer clock + date timezone tests
        run: pnpm --filter @workspace/api-server run test:clock-tz

  # Project-references typecheck only — `tsc --build` walks the
  # workspace's lib packages (packages/*) and their declared deps.
  # Artifact-level strict-mode errors (the 748 in api-server +
  # frontend) live outside this graph by design and are tracked
  # separately as Dispatch backlog work. This gate's job is to
  # catch lib-side regressions, which is what would actually
  # break Railway's build.
  tsc-check:
    name: tsc-check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: dispatch-stop-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check workspace lib references
        run: pnpm run typecheck:libs

  # api-server build — the same `tsx ./build.ts` Railway runs in
  # production. esbuild-bundles the server entry. Catches PRs that
  # tsc-pass in isolation but break the bundle (a missing import,
  # a node-only API used in shared code, etc.).
  build-api-server:
    name: build-api-server
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: dispatch-stop-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

  # Frontend build — vite build only. Runs in parallel with
  # build-api-server (which incidentally builds the frontend too)
  # so a frontend-specific Vite failure surfaces with a focused
  # check name instead of being hidden inside the api-server job.
  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dispatch-stop-guard
    env:
      PORT: "5000"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter @workspace/qleno run build
